[package]
edition      = "2024"
name         = "esp32-sun-info"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "esp32-sun-info"
path = "./src/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32", "unstable"] }
esp-backtrace = { version = "~0.19.0", features = [
    "esp32",
    "panic-handler",
    "println",
], default-features = false }
esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
esp-println = { version = "0.17.0", features = ["esp32"] }
esp-alloc = "0.10.0"
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32",
  "unstable",
  "wifi",
] }

# embassy ecosystem
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"
embassy-sync = "0.8"
embassy-embedded-hal = "0.6.0"
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "medium-ethernet",
  "udp",
#  "tcp",
  "dns",
] }

# networking application
sntpc = { version = "~0.11", default-features = false }
sntpc-net-embassy = { version = "0.11", default-features = false }

# misc lib
libm = "0.2.16"
fasttime = { version = "0.2", default-features = false }
thiserror = { version = "2.0.19", default-features = false }
static_cell      = "2.1.1"
critical-section = "1.2.0"
embedded-graphics-unicodefonts = "0.2"

# display
ssd1306 = { version = "0.10.0", features = ["async"] }
embedded-graphics = "0.8.1"
display-interface = "0.5.0"

# RGB LED
#smart-leds-trait = "0.3.2"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
